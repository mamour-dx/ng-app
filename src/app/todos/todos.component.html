<h3>todos list</h3>

@if (!todoItems().length) {
    <p>Loading...</p>
}

<form>
<label>Filter Todos</label>
<input
    name = "searchText"
    [(ngModel)]="searchText" 
    type="text" 
    placeholder="Search Todos..."
>
</form>

<ul class="todos">
 @for (todo of todoItems() | filterTodos : searchText(); track todo.id) {
    <app-todo-item 
    [todo]="todo"
    (todoToggled)="updateTodoItem(todo)"
    ></app-todo-item>
}
</ul>
